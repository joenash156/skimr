<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- Public Turnstile site key; PHP may replace the placeholder (see src/lib/turnstile.ts). -->
    <meta name="turnstile-site-key" content="__TURNSTILE_SITE_KEY__" />
    <!-- The same S mark as the public site (backend/public/assets/favicon.svg).
         Bump ?v= whenever the icon changes: browsers cache favicons for a long time. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg?v=2" />
    <title>Skimr</title>
    <!--
      No-flash theme and sidebar (spec 14.3, 14.4). The ONLY inline script
      allowed by the CSP: PHP replaces __CSP_NONCE__ with the request's nonce
      (brief 3a). Theme uses the public site's rule: localStorage.theme =
      light | dark | system. localStorage.sidebar = collapsed | expanded.
    -->
    <script nonce="__CSP_NONCE__">
      let t = null;
      let s = null;
      try {
        t = localStorage.getItem('theme');
        s = localStorage.getItem('sidebar');
      } catch {}
      document.documentElement.classList.toggle(
        'dark',
        t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches),
      );
      document.documentElement.dataset.sidebar = s === 'collapsed' ? 'collapsed' : 'expanded';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
