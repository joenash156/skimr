target-version = "py311"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

# Typographic quotes and no-break spaces really occur in PDF text; patterns match them on purpose.
allowed-confusables = ["’", "‘", " "]

[lint.per-file-ignores]
# Tests use assert and fake secrets on purpose.
"tests/**" = ["S101", "S105", "S106"]
